name: Actualizar datos FFCV

on:
  schedule:
    # Cada día a las 23:17 (hora de Madrid en invierno = 22:17 UTC)
    - cron: "17 22 * * *"
    # Sábados y domingos, además, a mediodía y por la tarde
    - cron: "17 12,18 * * 0,6"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar de la FFCV y guardar en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FFCV_TEMPORADA: "22"
          FFCV_COMPETICION: "905432151"
          FFCV_GRUPO: "905432153"
          FFCV_EQUIPOS: "29538208"   # Club Costa City E
        run: python scraper/scrape.py
