<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alevín 1º Año · Primera FFCV Alicante · Grup 2</title>
<style>
:root{
  --bg:#f4f6f3;--card:#fff;--ink:#16211a;--muted:#5f6b63;--line:#e2e7e3;
  --accent:#0f7a3d;--accent-soft:#e3f3e9;--fav:#fff4cc;--fav-line:#e8c04a;
  --win:#1f9d55;--draw:#c99a06;--loss:#d14343;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1511;--card:#18211b;--ink:#e8efe9;--muted:#9aa89e;--line:#2a352d;
  --accent:#3ccf7a;--accent-soft:#1c3324;--fav:#3a3215;--fav-line:#a88a2c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--accent);color:#fff;padding:18px 16px 14px}
@media (prefers-color-scheme:dark){header{background:#0d4f29}}
header h1{margin:0;font-size:19px;letter-spacing:-.2px}
header p{margin:3px 0 0;font-size:13px;opacity:.85}
nav{position:sticky;top:0;z-index:5;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:13px 4px 11px;font:600 14px inherit;font-family:inherit;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:720px;margin:0 auto;padding:14px 12px 40px}
.bar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.bar select{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer}
.bar button:disabled{opacity:.35}
h2{font-size:15px;margin:18px 2px 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
h2:first-child{margin-top:4px}
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px}
.match.fav{background:var(--fav);border-color:var(--fav-line)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.meta .when{font-weight:600;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:2px 0}
.team{display:flex;align-items:center;gap:8px;min-width:0}
.team span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.w span.n{font-weight:700}
.sc{font-weight:700;font-variant-numeric:tabular-nums;min-width:22px;text-align:right;font-size:16px}
.badge{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.place{font-size:12px;color:var(--muted);margin-top:7px;display:flex;gap:5px;align-items:flex-start}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.pend{background:#fde8e8;color:#b42318}
@media (prefers-color-scheme:dark){.tag.pend{background:#3b1d1d;color:#ff9a9a}}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
th,td{padding:9px 5px;text-align:center;font-size:13.5px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--bg)}
td.t{text-align:left;padding-left:2px}
td.t .team{gap:7px}
td.pos{width:28px;font-weight:700;color:var(--muted)}
td.pts{font-weight:800;font-size:15px}
tr:last-child td{border-bottom:0}
tr.fav td{background:var(--fav)}
tr.lead td.pos{color:var(--accent)}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:16px;height:16px;border-radius:4px;font-size:9.5px;font-style:normal;font-weight:700;color:#fff;display:grid;place-items:center}
.G{background:var(--win)}.E{background:var(--draw)}.P{background:var(--loss)}
.hide-s{display:none}
@media (min-width:560px){.hide-s{display:table-cell}}
.note{font-size:12.5px;color:var(--muted);margin:14px 4px 0}
.note a{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted);font-size:11.5px}
.res{font-size:11px;font-weight:800;width:20px;height:20px;border-radius:5px;color:#fff;display:inline-grid;place-items:center;margin-right:4px}
.star{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);padding:0 2px}
.star.on{color:#e0a800}
img.crest{object-fit:contain;background:#fff;border:1px solid var(--line);padding:2px}
.hero{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid;border-radius:14px;padding:12px 14px;margin:2px 0 12px}
.hero .badge{width:42px;height:42px;font-size:13px}
.hero b{display:block;font-size:16px}.hero small{color:var(--muted);font-size:12.5px}
table.squad td{font-size:13.5px}table.squad td.t{font-weight:600}
table.squad small{color:var(--muted)}
details.match summary{cursor:pointer;list-style:none;display:block;font-size:14px}
details.match summary::-webkit-details-marker{display:none}
details.match summary::after{content:"▾";float:right;margin-left:8px;color:var(--muted)}
details[open].match summary::after{content:"▴"}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lineup h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:0 0 4px}
.lineup ul{list-style:none;margin:0;padding:0}.lineup li{padding:3px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.lineup li b{display:inline-block;width:22px;color:var(--muted)}.lineup li small{color:var(--muted);font-size:11px}
nav button{font-size:13.5px}
</style>
</head>
<body>
<header>
  <h1>Primera FFCV Aleví 1r. any · Grup 2</h1>
  <p>Fútbol 8 · Provincia de Alicante · Temporada 2026/27</p>
</header>
<nav>
  <button data-v="proximos">Próximos</button>
  <button data-v="jornadas">Jornadas</button>
  <button data-v="clasif">Clasificación</button>
  <button data-v="mio">Costa City E</button>
</nav>
<main id="app"></main>

<script>
// ⚙️ Configura aquí tu proyecto de Supabase (la clave "anon" es pública, solo permite leer)
const SUPABASE_URL = "https://lmhqvpmfcgmgmyjfixos.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_j1zdUJklMirwCPxN_GcEBw_vobFV7Li";
const GRUPO = "905432153";
const MI = "29538208"; // Club Costa City 'E'
const SOURCE = "https://ffcv.es/competiciones/?view=partidos&cod_temporada=22&cod_competicion=905432151&cod_grupo=905432153#partidos";

let UPDATED = "", T = {}, J = {}, M = [], CLAS = [], ALINE = [], ENTRENADOR = "", ESQUEMA = "";
const PALETTE = ["#1d4ed8","#15803d","#b91c1c","#7c3aed","#0e7490","#c2410c","#1e40af","#16a34a","#be185d","#0369a1","#a16207","#047857","#9333ea","#0f766e"];
function corto(n){
  return n.replace(/^(C\.F\.|U\.D\.|C\.D\.|C\.E\.|S\.C\.D\.|Club Esportiu|Club de Fútbol|Club)\s+/i,"")
          .replace(/\s+(C\.F\.?|Club de Fútbol|C\.E\.|S\.A\.D\.)(?=\s|'|$)/gi,"")
          .replace(/'([A-Z])'/,"$1").replace(/\s+/g," ").trim();
}
async function sb(path){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});
  if(!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}
const isoToEs = s => s ? s.split("-").reverse().join("/") : "";
async function loadData(){
  const [eq, jo, pa, cl, al] = await Promise.all([
    sb("equipos?select=*"),
    sb(`jornadas?cod_grupo=eq.${GRUPO}&select=*&order=jornada`),
    sb(`partidos?cod_grupo=eq.${GRUPO}&select=*`),
    sb(`clasificacion?cod_grupo=eq.${GRUPO}&select=*&order=posicion`),
    sb(`alineaciones?cod_grupo=eq.${GRUPO}&cod_equipo=eq.${MI}&select=*&order=jornada`)
  ]);
  const enGrupo = new Set(pa.flatMap(p=>[p.cod_local,p.cod_visitante]));
  eq.filter(e=>enGrupo.has(e.cod_equipo)).sort((a,b)=>a.nombre.localeCompare(b.nombre))
    .forEach((e,i)=>T[e.cod_equipo]={n:e.nombre,s:corto(e.nombre),c:PALETTE[i%PALETTE.length],img:e.escudo_data||e.escudo_url||""});
  jo.forEach(j=>J[j.jornada]=isoToEs(j.fecha));
  M = pa.map(p=>{
    const [y,mo,d]=(p.fecha||"2099-01-01").split("-").map(Number);
    const [hh,mm]=(p.hora||"00:00").split(":").map(Number);
    return {j:p.jornada,d:isoToEs(p.fecha),h:p.hora||"--:--",l:p.cod_local,v:p.cod_visitante,
      gl:p.jugado?p.goles_local:null,gv:p.jugado?p.goles_visitante:null,campo:p.campo||"",
      ts:new Date(y,mo-1,d,hh,mm)};
  });
  CLAS = cl;
  ALINE = al.map(a=>({j:a.jornada,cod:a.cod_jugador,nombre:a.nombre,dorsal:a.dorsal??0,pos:a.posicion||"",tit:a.titular,cap:a.capitan,por:a.portero}));
  const ult = al[al.length-1]; ENTRENADOR = ult?.entrenador||"—"; ESQUEMA = ult?.esquema||"—";
  const last = pa.map(p=>p.actualizado).filter(Boolean).sort().pop();
  UPDATED = last ? new Date(last).toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"}) : "";
}

const DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmtDate=t=>`${DIAS[t.getDay()]} ${t.getDate()} ${MESES[t.getMonth()]}`;
const played=m=>m.gl!==null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let fav=store.get("fav")||MI;
let view="proximos", jSel=null, teamSel=fav;

function badge(k){const t=T[k];const ini=t.s.replace(/[^A-ZÁÉÍÓÚÑ]/g,"").slice(0,3);
  const txt=`<span class="badge" style="background:${t.c}">${ini}</span>`;
  if(!t.img) return txt;
  // escudo oficial de la FFCV; si no carga, se queda la insignia con iniciales
  return `<img class="badge crest" src="${t.img}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.fb" data-fb='${txt.replace(/'/g,"&#39;")}'>`}
function teamCell(k,bold){return `<span class="team${bold?" w":""}">${badge(k)}<span class="n">${T[k].s}</span></span>`}
function matchCard(m){
  const p=played(m);
  const wl=p&&m.gl>m.gv, wv=p&&m.gv>m.gl;
  const isFav=fav&&(m.l===fav||m.v===fav);
  const late=!p&&m.ts<new Date();
  const tag=p?"":late?`<span class="tag pend">Pendiente</span>`:"";
  const aplaz=(+m.d.split("/")[1]!==+J[m.j].split("/")[1]||Math.abs(m.ts-parseD(J[m.j]))>6*864e5)?` · <span>aplazado (J${m.j})</span>`:"";
  return `<div class="match${isFav?" fav":""}">
    <div class="meta"><span><span class="when">${fmtDate(m.ts)} · ${m.h}</span>${view!=="jornadas"?` · J${m.j}`:""}</span>${tag}</div>
    <div class="row">${teamCell(m.l,wl)}<span class="sc">${p?m.gl:""}</span></div>
    <div class="row">${teamCell(m.v,wv)}<span class="sc">${p?m.gv:""}</span></div>
    <div class="place">📍 <span>${m.campo}</span></div>
  </div>`;
}
function parseD(s){const[d,mo,y]=s.split("/");return new Date(+y,+mo-1,+d)}

function table(){
  if(CLAS.length) return CLAS.filter(c=>T[c.cod_equipo]).map(c=>({k:c.cod_equipo,pj:c.pj,g:c.g,e:c.e,p:c.p,gf:c.gf,gc:c.gc,pts:c.puntos,form:(c.racha||"").split("")}));
  const s={};Object.keys(T).forEach(k=>s[k]={k,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0,form:[]});
  M.filter(played).sort((a,b)=>a.ts-b.ts).forEach(m=>{
    const L=s[m.l],V=s[m.v];L.pj++;V.pj++;L.gf+=m.gl;L.gc+=m.gv;V.gf+=m.gv;V.gc+=m.gl;
    if(m.gl>m.gv){L.g++;V.p++;L.pts+=3;L.form.push("G");V.form.push("P")}
    else if(m.gl<m.gv){V.g++;L.p++;V.pts+=3;V.form.push("G");L.form.push("P")}
    else{L.e++;V.e++;L.pts++;V.pts++;L.form.push("E");V.form.push("E")}
  });
  return Object.values(s).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||a.pj-b.pj);
}

function vProximos(){
  const now=new Date();
  const pend=M.filter(m=>!played(m)&&m.ts<now).sort((a,b)=>a.ts-b.ts);
  const up=M.filter(m=>!played(m)&&m.ts>=now).sort((a,b)=>a.ts-b.ts);
  let h="";
  if(fav){
    const nf=up.find(m=>m.l===fav||m.v===fav);
    if(nf) h+=`<h2>Próximo de ${T[fav].s}</h2>`+matchCard(nf);
  }
  if(up.length){
    const nj=up[0].j;
    const list=M.filter(m=>m.j===nj&&!played(m)).sort((a,b)=>a.ts-b.ts);
    h+=`<h2>Jornada ${nj} · ${fmtDate(parseD(J[nj]))}</h2>`+list.map(matchCard).join("");
    const nj2=up.find(m=>m.j>nj);
    if(nj2){const l2=M.filter(m=>m.j===nj2.j).sort((a,b)=>a.ts-b.ts);h+=`<h2>Jornada ${nj2.j} · ${fmtDate(parseD(J[nj2.j]))}</h2>`+l2.map(matchCard).join("")}
  } else h+=`<div class="empty">No quedan partidos por jugar.</div>`;
  if(pend.length) h+=`<h2>Pendientes de resultado</h2>`+pend.map(matchCard).join("");
  const last=M.filter(played).sort((a,b)=>b.ts-a.ts).slice(0,6);
  if(last.length) h+=`<h2>Últimos resultados</h2>`+last.map(matchCard).join("");
  return h;
}
function currentJ(){const now=new Date();const up=M.filter(m=>m.ts>=now).sort((a,b)=>a.ts-b.ts)[0];return up?up.j:Math.max(...Object.keys(J).map(Number))}
function vJornadas(){
  if(!jSel) jSel=Math.max(1,M.filter(played).reduce((a,m)=>Math.max(a,m.j),1));
  const NJ=Math.max(...Object.keys(J).map(Number));
  const opts=Object.keys(J).map(n=>`<option value="${n}"${+n===jSel?" selected":""}>Jornada ${n} · ${J[n].slice(0,5)}</option>`).join("");
  const list=M.filter(m=>m.j===jSel).sort((a,b)=>a.ts-b.ts);
  return `<div class="bar"><button id="jp"${jSel<=1?" disabled":""} aria-label="Jornada anterior">‹</button><select id="js">${opts}</select><button id="jn"${jSel>=NJ?" disabled":""} aria-label="Jornada siguiente">›</button></div>`+list.map(matchCard).join("");
}
function vClasif(){
  const t=table();
  return `<table><thead><tr><th></th><th style="text-align:left">Equipo</th><th>PJ</th><th class="hide-s">G</th><th class="hide-s">E</th><th class="hide-s">P</th><th>GF</th><th>GC</th><th>Pts</th><th class="hide-s">Racha</th></tr></thead><tbody>`+
  t.map((r,i)=>`<tr class="${r.k===fav?"fav":""}${i===0?" lead":""}" data-team="${r.k}" style="cursor:pointer"><td class="pos">${i+1}</td><td class="t">${teamCell(r.k)}</td><td>${r.pj}</td><td class="hide-s">${r.g}</td><td class="hide-s">${r.e}</td><td class="hide-s">${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td class="pts">${r.pts}</td><td class="hide-s"><span class="form">${r.form.slice(-5).map(f=>`<i class="${f}">${f}</i>`).join("")}</span></td></tr>`).join("")+
  `</tbody></table><p class="note">Clasificación oficial de la FFCV. Toca un equipo para ver su calendario.</p>`;
}
function vEquipo(){
  const opts=Object.keys(T).sort((a,b)=>T[a].s.localeCompare(T[b].s)).map(k=>`<option value="${k}"${k===teamSel?" selected":""}>${T[k].s}</option>`).join("");
  const r=table(); const pos=r.findIndex(x=>x.k===teamSel); const st=r[pos];
  const ms=M.filter(m=>m.l===teamSel||m.v===teamSel).sort((a,b)=>a.ts-b.ts);
  const now=new Date();
  const res=m=>{if(!played(m))return"";const mine=m.l===teamSel?m.gl:m.gv,oth=m.l===teamSel?m.gv:m.gl;const k=mine>oth?"G":mine<oth?"P":"E";return `<span class="res ${k}">${k}</span>`};
  return `<div class="bar"><select id="ts">${opts}</select><button class="star${fav===teamSel?" on":""}" id="fv" aria-label="Marcar como mi equipo" title="Marcar como mi equipo">${fav===teamSel?"★":"☆"}</button></div>
  <div class="stats"><div class="stat"><b>${pos+1}º</b><small>Posición</small></div><div class="stat"><b>${st.pts}</b><small>Puntos</small></div><div class="stat"><b>${st.g}-${st.e}-${st.p}</b><small>G-E-P</small></div><div class="stat"><b>${st.gf}:${st.gc}</b><small>Goles</small></div></div>
  <h2>Próximos</h2>${ms.filter(m=>!played(m)).map(matchCard).join("")||'<div class="empty">Sin partidos pendientes.</div>'}
  <h2>Jugados</h2>${ms.filter(played).reverse().map(m=>matchCard(m).replace('<span class="when">',res(m)+'<span class="when">')).join("")||'<div class="empty">Aún no ha jugado.</div>'}`;
}

function resFor(m,k){if(!played(m))return null;const a=m.l===k?m.gl:m.gv,b=m.l===k?m.gv:m.gl;return a>b?"G":a<b?"P":"E"}
function vMio(){
  const k=MI, t=T[k], r=table(), pos=r.findIndex(x=>x.k===k), st=r[pos];
  const ms=M.filter(m=>m.l===k||m.v===k).sort((a,b)=>a.ts-b.ts);
  const pj=ms.filter(played);
  const side=(f)=>{const x=pj.filter(f);const g=x.filter(m=>resFor(m,k)==="G").length,e=x.filter(m=>resFor(m,k)==="E").length;
    const gf=x.reduce((s,m)=>s+(m.l===k?m.gl:m.gv),0),gc=x.reduce((s,m)=>s+(m.l===k?m.gv:m.gl),0);
    return {n:x.length,g,e,p:x.length-g-e,gf,gc,pts:g*3+e}};
  const casa=side(m=>m.l===k), fuera=side(m=>m.v===k);
  const now=new Date();
  const next=ms.find(m=>!played(m)&&m.ts>=now);
  const pend=ms.filter(m=>!played(m)&&m.ts<now);
  const avg=x=>(pj.length?(x/pj.length).toFixed(1).replace(".",","):"0");

  // estadísticas por jugador
  const jornadasActa=[...new Set(ALINE.map(a=>a.j))];
  const P={};
  ALINE.forEach(a=>{
    const p=P[a.cod]||(P[a.cod]={cod:a.cod,nombre:a.nombre,dorsal:a.dorsal,conv:0,tit:0,sup:0,cap:0,pos:{},G:0,E:0,Pd:0,por:a.por,ult:0});
    p.conv++; a.tit?p.tit++:p.sup++; if(a.cap)p.cap++; if(a.pos)p.pos[a.pos]=(p.pos[a.pos]||0)+1;
    if(a.j>=p.ult){p.ult=a.j;p.dorsal=a.dorsal}
    const m=M.find(x=>x.j===a.j&&(x.l===k||x.v===k)); const rr=m&&resFor(m,k); if(rr==="G")p.G++;else if(rr==="E")p.E++;else if(rr==="P")p.Pd++;
  });
  const lista=Object.values(P).map(p=>({...p,posH:Object.entries(p.pos).sort((a,b)=>b[1]-a[1])[0]?.[0]||(p.por?"Portero/a":"—")}))
    .sort((a,b)=>(b.por-a.por)||a.dorsal-b.dorsal);
  const abrev={"Portero/a":"POR","Defensa":"DEF","Medio":"MED","Ataque":"DEL","—":"—"};

  const alin=jornadasActa.sort((a,b)=>b-a).map(j=>{
    const m=M.find(x=>x.j===j&&(x.l===k||x.v===k)); const rr=resFor(m,k);
    const rival=m.l===k?m.v:m.l; const sc=m.l===k?`${m.gl}-${m.gv}`:`${m.gv}-${m.gl}`;
    const xs=ALINE.filter(a=>a.j===j);
    const li=x=>`<li><b>${x.dorsal}</b> ${x.nombre}${x.cap?' <span class="tag">C</span>':""}<small> ${x.pos?abrev[x.pos]:""}</small></li>`;
    return `<details class="match"><summary><span class="res ${rr}">${rr}</span><b>J${j}</b> · ${m.l===k?"vs":"en"} ${T[rival].s} <b style="float:right">${sc}</b></summary>
      <div class="lineup"><div><h3>Titulares</h3><ul>${xs.filter(x=>x.tit).map(li).join("")}</ul></div><div><h3>Suplentes</h3><ul>${xs.filter(x=>!x.tit).map(li).join("")}</ul></div></div></details>`;
  }).join("");

  return `<div class="hero" style="border-color:${t.c}">${badge(k)}<div><b>${t.n}</b><small>Entrenador: ${ENTRENADOR} · Sistema ${ESQUEMA}</small></div></div>
  <div class="stats"><div class="stat"><b>${pos+1}º</b><small>de ${r.length}</small></div><div class="stat"><b>${st.pts}</b><small>Puntos</small></div><div class="stat"><b>${st.g}-${st.e}-${st.p}</b><small>G-E-P</small></div><div class="stat"><b>${st.gf}:${st.gc}</b><small>Goles</small></div></div>
  <div class="stats"><div class="stat"><b>${avg(st.gf)}</b><small>Goles/partido</small></div><div class="stat"><b>${avg(st.gc)}</b><small>Recibidos/p.</small></div><div class="stat"><b>${casa.pts}</b><small>Pts en casa (${casa.n})</small></div><div class="stat"><b>${fuera.pts}</b><small>Pts fuera (${fuera.n})</small></div></div>
  ${next?`<h2>Próximo partido</h2>${matchCard(next)}`:""}
  ${pend.length?`<h2>Pendiente</h2>${pend.map(matchCard).join("")}`:""}
  <h2>Plantilla y estadísticas</h2>
  <table class="squad"><thead><tr><th>#</th><th style="text-align:left">Jugador</th><th>Pos</th><th title="Convocatorias">Conv</th><th title="Titular">Tit</th><th title="Suplente">Sup</th><th title="Capitán">C</th><th class="hide-s" title="Resultados con él convocado">G-E-P</th></tr></thead><tbody>
  ${lista.map(p=>`<tr><td class="pos">${p.dorsal}</td><td class="t">${p.nombre}</td><td><small>${abrev[p.posH]||p.posH}</small></td><td><b>${p.conv}</b><small>/${jornadasActa.length}</small></td><td>${p.tit}</td><td>${p.sup}</td><td>${p.cap||""}</td><td class="hide-s">${p.G}-${p.E}-${p.Pd}</td></tr>`).join("")}
  </tbody></table>
  <p class="note">${lista.length} jugadores han ido convocados en ${jornadasActa.length} actas. Las actas de fútbol 8 de la FFCV no recogen goleadores, tarjetas ni cambios. Nombres abreviados.</p>
  <h2>Alineaciones por partido</h2>${alin}
  <h2>Calendario completo</h2>${ms.map(m=>{const rr=resFor(m,k);return rr?matchCard(m).replace('<span class="when">',`<span class="res ${rr}">${rr}</span><span class="when">`):matchCard(m)}).join("")}`;
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view||(view==="equipo"&&b.dataset.v==="clasif")));
  const app=document.getElementById("app");
  app.innerHTML=({proximos:vProximos,jornadas:vJornadas,clasif:vClasif,equipo:vEquipo,mio:vMio})[view]()+
    `<p class="note">Datos oficiales de la FFCV actualizados el ${UPDATED}. <a href="${SOURCE}">Ver en ffcv.es</a></p>`;
  const $=id=>document.getElementById(id);
  if($("js")) $("js").onchange=e=>{jSel=+e.target.value;render()};
  if($("jp")) $("jp").onclick=()=>{jSel--;render()};
  if($("jn")) $("jn").onclick=()=>{jSel++;render()};
  if($("ts")) $("ts").onchange=e=>{teamSel=e.target.value;render()};
  if($("fv")) $("fv").onclick=()=>{fav=fav===teamSel?"":teamSel;store.set("fav",fav);render()};
  app.querySelectorAll("tr[data-team]").forEach(tr=>tr.onclick=()=>{if(tr.dataset.team===MI)return go("mio");teamSel=tr.dataset.team;go("equipo")});
}
function go(v){view=v;if(location.hash!=="#"+v)history.replaceState(null,"","#"+v);render();window.scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
const h=location.hash.slice(1); if(["proximos","jornadas","clasif","equipo","mio"].includes(h)) view=h;
window.addEventListener("hashchange",()=>{const x=location.hash.slice(1);if(x&&x!==view&&["proximos","jornadas","clasif","equipo","mio"].includes(x)){view=x;render()}});
document.getElementById("app").innerHTML='<div class="empty">Cargando datos…</div>';
loadData().then(()=>{
  if(!T[fav]) fav=T[MI]?MI:"";
  teamSel=fav||Object.keys(T)[0];
  render();
}).catch(e=>{document.getElementById("app").innerHTML=`<div class="empty">No se pudieron cargar los datos.<br><small>${e.message}</small></div>`});
</script>
</body>
</html>
